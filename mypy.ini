[mypy]
# Mypy configuration for PyStore
# https://mypy.readthedocs.io/

# Python version to target
python_version = 3.10

# Strictness settings
warn_return_any = False
warn_unused_ignores = False
warn_redundant_casts = True
warn_unreachable = True

# Error settings
show_error_codes = True
show_traceback = True
pretty = True

# Ignore missing imports for third-party packages without type stubs
ignore_missing_imports = True

# Allow untyped calls for gradual typing
disallow_untyped_calls = False
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Per-module settings
[mypy-pystore.*]
# Gradually increase strictness for pystore modules
disallow_untyped_defs = False
warn_return_any = False

[mypy-tests.*]
# Be more lenient with tests
disallow_untyped_defs = False
ignore_errors = False
